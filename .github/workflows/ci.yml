name: AEGIS-0.5M CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest suite
        run: pytest -v

      - name: Run full simulation & figure sanity check (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m src.cli sim
          python -m src.cli plot
          test -f figures/fig1_mach05_aerodynamics_gimbal.png
          test -f figures/fig2_altitude_gsd_johnson.png
          test -f figures/fig3_rgb_lwir_fusion_benchmark.png
          test -f figures/fig4_behavioral_anomaly_latency.png

  cpp23-edge-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++23 edge inference kernel (g++ -std=c++23 -O3)
        run: |
          g++ --version
          mkdir -p results
          g++ -std=c++23 -O3 -Wall -Wextra -Wpedantic cpp_inference/uav_edge_pipeline.cpp -o cpp_inference/uav_edge_pipeline
          ./cpp_inference/uav_edge_pipeline --frames 2000 --json-out results/cpp_benchmark.json

      - name: Verify CMake C++23 build
        run: |
          cmake -S cpp_inference -B cpp_inference/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp_inference/build --parallel
          ./cpp_inference/build/uav_edge_pipeline --frames 500
